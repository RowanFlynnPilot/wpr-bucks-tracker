name: Morning digest bake

# BACKUP for the morning image bake. The primary is WPR's Cloudflare scheduler
# Worker, which dispatches deploy.yml at 5:00 AM Central on time.
#
# Gets the email image (digest.png) re-baked at a FIXED time before the morning
# newsletter (built 6:58 AM, sent 7:02 AM Central). GitHub's own `schedule`
# can't do that: scheduled runs queue behind everyone else's and fired 3–6
# hours late in Oct 2026 and 6–8 in Nov (the Brewers' morning bake landed
# anywhere from 5:24 to 8:03 AM Central — the source of this workflow). A
# workflow_dispatch, by contrast, starts immediately. So this job is triggered
# sometime in the evening (lateness doesn't matter), SLEEPS until BAKE_AT
# Central, then dispatches the deploy workflow, which builds + re-bakes
# digest.png right away. It only times the image bake — it fetches no data and
# writes nothing (see CLAUDE.md: no data crons).

on:
  schedule:
    # The PRIMARY 5:00 AM trigger is WPR's Cloudflare scheduler Worker (punctual;
    # wpr-newsletter/wpr-scheduler-worker.js dispatches deploy.yml directly).
    # These are the backup. In Nov 2026 GitHub fired them 6–8 hours late — the
    # old 11:47 PM / 1:17 AM triggers landed at 6–9 AM, after the 6:58 build —
    # so they're spread through the evening: whichever arrives within the 6-hour
    # job limit of 5:00 AM waits for it, earlier arrivals step aside (below).
    # UTC, no DST: 6:17 / 8:17 / 10:17 / 11:47 PM CST (an hour later in CDT).
    # Odd minutes: the top/half of the hour is GitHub's most congested time.
    - cron: '17 0 * * *'
    - cron: '17 2 * * *'
    - cron: '17 4 * * *'
    - cron: '47 5 * * *'
  workflow_dispatch: # manual run = dispatch the bake now (handy for testing)

permissions:
  actions: write # to dispatch deploy.yml — GITHUB_TOKEN may trigger workflow_dispatch runs

# The newest waiter replaces an older one still sleeping, so one bake fires at
# BAKE_AT. (A run that steps aside as too early can only start before every
# valid waiter — earlier than BAKE_AT minus the wait limit — so it never
# cancels one.)
concurrency:
  group: morning-digest
  cancel-in-progress: true

env:
  BAKE_AT: '05:00'  # Central — after any West Coast final, two hours before the 7:02 send
  MAX_WAIT_MIN: 345 # under the job's 355-minute timeout

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # Manual runs log the target (proves the Central-time math on the runner) but skip the sleep.
      - name: Wait until ${{ env.BAKE_AT }} Central
        id: wait
        run: |
          export TZ=America/Chicago
          if [ "$(date +%-H)" -ge 12 ]; then
            # Afternoon/evening arrival: the bake is tomorrow morning.
            target=$(date -d "tomorrow $BAKE_AT" +%s)
          else
            # Morning arrival — in the past if GitHub fired after BAKE_AT → bake now.
            target=$(date -d "today $BAKE_AT" +%s)
          fi
          wait=$(( target - $(date +%s) ))
          echo "Now $(date '+%F %H:%M %Z') · bake target $(date -d "@$target" '+%F %H:%M %Z')"
          if [ "${{ github.event_name }}" != schedule ]; then
            echo "Manual run — dispatching now"
          elif [ "$wait" -gt $(( MAX_WAIT_MIN * 60 )) ]; then
            echo "Too early to wait out ($(( wait / 60 )) min) — a later trigger takes the bake"
            echo "bake=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$wait" -gt 0 ]; then
            echo "Sleeping $(( wait / 60 )) min"
            sleep "$wait"
          else
            echo "Already past $BAKE_AT Central — baking now"
          fi
          echo "bake=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch the deploy (rebuild + re-bake digest.png)
        if: steps.wait.outputs.bake == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
